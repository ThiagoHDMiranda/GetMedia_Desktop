<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/getmedia_icon_256x256.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Baixe vídeos e áudios do YouTube, Instagram, TikTok e mais de forma rápida e gratuita." />
    <title>GetMedia</title>
    <script>
      // Apply saved theme before first paint to prevent FOUC.
      // Defaults to dark. Mirrors the localStorage pattern used by useTheme.ts.
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
