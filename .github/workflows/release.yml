name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/GetMedia-Setup-*.exe
            release/GetMedia-Setup-*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
